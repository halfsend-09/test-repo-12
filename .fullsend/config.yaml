# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: good-allowed
      source: harness/good-allowed.yaml
    - name: no-allow
      source: https://raw.githubusercontent.com/halfsend-09/test-repo-12-url-harness-host/main/harness/no-allow.yaml#sha256=964a26daa483d497a126bd2c86b0f3008ea24e2236be9b881a72f66e8dc37821
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - halfsend-09/test-repo-12
            - fullsend-ai/fullsend
