# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: url-ping
      source: https://raw.githubusercontent.com/halfsend-09/test-repo-12-url-harness-host/main/harness/url-ping.yaml#sha256=8c36fd364d31913862e4235bc48f739b106a6123cd0295dd4b9505eb72b4cc1b
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/halfsend-09/test-repo-12-url-harness-host/
create_issues:
    allow_targets:
        repos:
            - halfsend-09/test-repo-12
            - fullsend-ai/fullsend
